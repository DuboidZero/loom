name: Build Windows

on:
  # Regular CI: run on every push/PR to main
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual trigger (useful for debugging builds)
  workflow_dispatch:
  # Called by release-please.yml when a GitHub Release is created
  workflow_call:
    inputs:
      tag_name:
        description: "The release tag (e.g. v4.1.0)"
        type: string
        required: false
        default: ""
      upload_url:
        description: "GitHub Release upload URL for attaching assets"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install -r server/requirements.txt

      - name: Install Node dependencies
        working-directory: client
        run: npm ci

      - name: Build App
        working-directory: client
        run: npm run build:windows

      # ── Regular CI: upload as workflow artifact ──────────────────────────
      - name: Upload CI Artifacts
        if: inputs.upload_url == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi

      # ── Release build: attach files to the GitHub Release ────────────────
      - name: Find NSIS installer
        if: inputs.upload_url != ''
        id: find_nsis
        shell: bash
        run: |
          FILE=$(find client/src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $FILE)" >> "$GITHUB_OUTPUT"

      - name: Find MSI installer
        if: inputs.upload_url != ''
        id: find_msi
        shell: bash
        run: |
          FILE=$(find client/src-tauri/target/release/bundle/msi -name "*.msi" | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $FILE)" >> "$GITHUB_OUTPUT"

      - name: Upload NSIS installer to GitHub Release
        if: inputs.upload_url != '' && steps.find_nsis.outputs.path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_nsis.outputs.path }}
          asset_name: ${{ steps.find_nsis.outputs.name }}
          asset_content_type: application/octet-stream

      - name: Upload MSI installer to GitHub Release
        if: inputs.upload_url != '' && steps.find_msi.outputs.path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_msi.outputs.path }}
          asset_name: ${{ steps.find_msi.outputs.name }}
          asset_content_type: application/x-msi
